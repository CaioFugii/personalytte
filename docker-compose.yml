services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: personalytte
      POSTGRES_PASSWORD: personalytte
      POSTGRES_DB: personalytte
    ports:
      - "5432:5432"
    volumes:
      - personalytte_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalytte -d personalytte"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  personalytte_pg:
